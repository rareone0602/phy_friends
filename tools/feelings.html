<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>phy's fwiends · feelings</title>
<style>
  :root { --paper: #fbf9f3; --ink: #3d3c39; --ink-2: #6d6a63; --rule: #cfdbe8; --cell: 132px; }
  body { margin: 0; padding: 24px; background: var(--paper); color: var(--ink); font: 14px/1.4 ui-monospace, Menlo, monospace; }
  p { margin: 0 0 16px; color: var(--ink-2); }
  label { cursor: pointer; }
  table { border-collapse: collapse; }
  th { font-weight: 400; color: var(--ink-2); padding: 4px 6px; white-space: nowrap; }
  thead th { position: sticky; top: 0; background: var(--paper); z-index: 1; }
  tbody th { text-align: right; }
  td { padding: 0; border-bottom: 1px solid var(--rule); }
  .cell { width: var(--cell); height: var(--cell); }
  .cell svg { display: block; width: 100%; height: 100%; overflow: visible; }
</style>
</head>
<body>
<p>every friend in every feeling of src/emotion.js. <label><input id="live" type="checkbox"> play them</label>
  (each plays its reaction, then holds the feeling, then starts again). <label><input id="stand" type="checkbox"> stand them up</label>
  (a standing friend adds its arms and legs). ?who=howdi,phy and ?feel=sad,cross narrow the sheet; ?live plays it and ?stand
  stands them up.</p>
<table><thead><tr id="feelings"><th></th></tr></thead><tbody id="rows"></tbody></table>

<script src="../src/phyfriends.js"></script>
<script src="../src/anim.js"></script>
<script src="../src/emotion.js"></script>
<script src="../characters/howdi/howdi.js"></script>
<script src="../characters/yuanyuan/yuanyuan.js"></script>
<script src="../characters/phy/phy.js"></script>
<script src="../characters/fruit/fruit.js"></script>
<script src="../characters/yuda/yuda.js"></script>
<script src="../characters/terry/terry.js"></script>
<script src="../characters/brian/brian.js"></script>
<script src="../characters/mumuyou/mumuyou.js"></script>
<script src="../characters/kevin/kevin.js"></script>
<script src="../characters/bardell/bardell.js"></script>
<script src="../characters/cowosus/cowosus.js"></script>
<script src="../characters/raze/raze.js"></script>
<script src="../characters/tanyuan/tanyuan.js"></script>
<script src="../characters/alfie/alfie.js"></script>
<script src="../characters/teni/teni.js"></script>
<script src="../characters/whitedeer/whitedeer.js"></script>
<script src="../characters/jiaoyue/jiaoyue.js"></script>
<script src="../characters/claude/claude.js"></script>
<script>
  // A review sheet for the emotion library: a row per friend and a column per feeling, drawn still
  // (the feeling's face) or playing (its reaction, then the feeling held, over and over), seated or
  // standing. Claude's row shows what the library gives a friend that shows no feelings: the movement
  // alone, seated, since it has no standing figure.
  const PF = PhyFriends, A = PF.anim, E = PF.emotion;
  const LOOP_SECONDS = 6;   // A playing cell starts its feeling again this often.
  const VIEW = { w: 300, h: 300, x: 150, y: 150, scale: 0.95, rotate: 0 };  // Room for ears and a hop.
  const STANDING_VIEW = { ...VIEW, y: 165, scale: 0.85 };                  // Room for the ears of a friend standing.
  const query = new URLSearchParams(location.search);
  const pick = (key, all) => (query.get(key) ? query.get(key).split(',').filter(name => all.includes(name)) : all);
  const friends = pick('who', PF.list()), feelings = pick('feel', E.names);

  const live = document.getElementById('live'), stand = document.getElementById('stand');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  live.checked = query.has('live');
  stand.checked = query.has('stand');
  let start = 0, cells = [];

  for (const feeling of feelings) document.getElementById('feelings').insertAdjacentHTML('beforeend', `<th>${feeling}</th>`);

  // Mounts a cell for every friend and feeling, seated or standing as the checkbox says.
  function build() {
    const stance = stand.checked ? 'stand' : 'sit', view = stand.checked ? STANDING_VIEW : VIEW;
    const rows = document.getElementById('rows');
    rows.textContent = '';
    cells = [];
    for (const name of friends) {
      const row = document.createElement('tr');
      row.innerHTML = `<th>${name}</th>`;
      for (const feeling of feelings) {
        const cell = document.createElement('td'), box = document.createElement('div');
        box.className = 'cell';
        cell.appendChild(box);
        row.appendChild(cell);
        const rig = PF.mount(box, name, { view, bg: false });
        rig.svg.setAttribute('role', 'img');
        rig.svg.setAttribute('aria-label', `${name}, ${feeling}${stand.checked ? ', standing' : ''}`);
        cells.push({ rig, stance, clip: E.feel(feeling, { spec: name }), still: A.sample({ ...E.face(feeling, { spec: name }), stance }) });
      }
      rows.appendChild(row);
    }
  }

  // Under reduced motion a playing cell shows only the faces, as a live page does.
  function frame(now) {
    if (!live.checked) return drawStill();
    const t = ((now - start) / 1000) % LOOP_SECONDS;
    for (const cell of cells) {
      const partial = cell.clip(t);
      cell.rig.setPose(A.sample({ ...(reduced.matches ? A.faceOnly(partial) : partial), stance: cell.stance }), true);
    }
    requestAnimationFrame(frame);
  }

  function drawStill() {
    for (const cell of cells) cell.rig.setPose(cell.still, true);
  }

  live.addEventListener('change', () => {
    start = performance.now();
    requestAnimationFrame(frame);
  });
  stand.addEventListener('change', () => {
    build();
    if (!live.checked) drawStill();  // A playing sheet draws the new cells on its next frame.
  });
  build();
  requestAnimationFrame(frame);
</script>
</body>
</html>

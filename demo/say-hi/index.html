<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>say hi · phy's fwiends</title>
<meta name="description" content="say hi: a music video about the library that draws the fwiends, drawn by the library itself.">
<meta name="theme-color" content="#fbf9f3">
<link rel="icon" href="../../lib/style/site/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../lib/style/site/notebook.css">
<link rel="stylesheet" href="../../lib/style/site/pencil.css">
<link rel="stylesheet" href="say-hi.css">
</head>
<body>
<script src="../../lib/style/site/graphite.js"></script>

<div class="sh-host" aria-label="say hi, a film"></div>
<p class="sh-controls"><noscript>the film is drawn live, so it needs JavaScript to play.</noscript><button type="button" class="sh-play">play</button><span class="sh-time"></span></p>
<!-- The music: the local copy where it exists (out/ is not published), else the same file from its source (beats.js).
     The script below fetches it once the page has loaded, so that it does not hold up the film's own files. -->
<audio class="sh-music" preload="none">
  <source src="../../out/video/music/candidates/cc-composers/komiku-the-road-we-use-to-travel.mp3" type="audio/mpeg">
  <source src="https://archive.org/download/Komiku-TaleOnTheLate/Komiku_-_03_-_The_road_we_use_to_travel_when_we_were_kids.mp3" type="audio/mpeg">
</audio>

<script src="../../lib/fwiends/src/phyfriends.js"></script>
<script src="../../lib/fwiends/src/anim.js"></script>
<script src="../../lib/fwiends/src/emotion.js"></script>
<script src="../../lib/fwiends/src/live.js"></script>
<script src="../../lib/fwiends/src/pen.js"></script>
<script src="../../lib/fwiends/src/title-pen.js"></script>
<script src="../../lib/fwiends/src/cast.js"></script>
<script src="../../lib/fwiends/film/scene.js"></script>
<script src="beats.js"></script>
<script src="core.js"></script>
<script src="pages.js"></script>
<script src="components.js"></script>
<script src="source-data.js"></script>
<!-- The sections, in the film's order. Each registers itself; the core builds them once the cast is in. -->
<script src="sections/intro.js"></script>
<script src="sections/build.js"></script>
<script src="sections/gallery.js"></script>
<script src="sections/method.js"></script>
<script src="sections/owners.js"></script>
<script src="sections/finale.js"></script>
<script>
  // The film owns window.film (the film contract in tools/pf.py). Opened by tools/pf.py film (?film), it
  // is filmed frame by frame; otherwise it fits the window and plays with the music, or holds the
  // frame that ?at= names: a bar and beat (?at=25.4) or seconds (?at=45.69s). Nothing moves until play
  // is pressed, under reduced motion as without it; once asked for, the film plays as it is filmed,
  // since the same film with its friends held still and its camera moving would be neither.
  (function () {
    'use strict';
    const SH = window.SayHi, host = document.querySelector('.sh-host');
    if (SH.MODE.filming) document.documentElement.classList.add('sh-filming');
    const ready = SH.own(host);
    if (SH.MODE.filming) return;

    const frame = () => host.querySelector('.sh-frame');
    const music = document.querySelector('.sh-music'), button = document.querySelector('.sh-play'), clock = document.querySelector('.sh-time');
    const lastSource = music.querySelector('source:last-of-type');
    const WAIT_LIMIT = 30;  // Seconds the film waits for its music before saying that it has not come.
    const NO_MUSIC = 'the music did not load, so the film cannot play.';
    let playing = false, ticking = false, offset = 0, pending = false, waitTimer = null, waitLabel = '';

    // The music is fetched once the page has loaded, so that it is usually ready before play is pressed.
    addEventListener('load', () => { music.preload = 'auto'; }, { once: true });

    // Scales the frame to the window, centered.
    function fit() {
      const f = frame();
      if (!f) return;
      const scale = Math.min(innerWidth / SH.FRAME.width, innerHeight / SH.FRAME.height);
      f.style.transform = `translate(${(innerWidth - SH.FRAME.width * scale) / 2}px, ${(innerHeight - SH.FRAME.height * scale) / 2}px) scale(${scale})`;
    }
    addEventListener('resize', fit);

    // The film follows the music's clock, so it holds still whenever the music does.
    function tick() {
      if (!ticking) return;
      const t = music.currentTime % SayHi.beats.DURATION;
      if (!waitTimer) clock.textContent = SayHi.beats.label(t);
      if (!pending) {
        pending = true;
        SH.seek(t).then(() => { pending = false; });
      }
      requestAnimationFrame(tick);
    }

    // The music is started within the press itself, since Safari allows sound only from a reader's gesture,
    // and the film starts once the music plays. Until then it waits, under the kit's wait mark, since it is
    // cut to its music. A pause keeps the time it was made at, within the film, however often the music has
    // looped.
    function play() {
      playing = !playing;
      button.textContent = playing ? 'pause' : 'play';
      if (!playing) {
        if (ticking) offset = music.currentTime % SayHi.beats.DURATION;
        halt();
        return;
      }
      if (music.networkState === HTMLMediaElement.NETWORK_NO_SOURCE) return giveUp();  // Its sources failed before.
      seekMusic();
      music.loop = true;
      if (music.readyState < HTMLMediaElement.HAVE_FUTURE_DATA) showWait();
      music.play().catch(refused);
    }

    // Sets the music to offset; before its metadata has loaded, once it has.
    function seekMusic() {
      if (music.readyState === HTMLMediaElement.HAVE_NOTHING) {
        if (offset > 0.05) music.addEventListener('loadedmetadata', () => { music.currentTime = offset; }, { once: true });
      } else if (Math.abs(music.currentTime - offset) > 0.05) {
        music.currentTime = offset;  // A seek, even to where the music is, holds it back for a moment.
      }
    }

    // Stops the film and the music where they are.
    function halt() {
      ticking = false;
      hideWait();
      music.pause();
    }

    // The music did not come, by an error or within WAIT_LIMIT: the film stops, and the clock's place says so.
    function giveUp() {
      if (ticking) offset = music.currentTime % SayHi.beats.DURATION;
      playing = false;
      button.textContent = 'play';
      halt();
      clock.textContent = NO_MUSIC;
    }

    // play() was refused or interrupted. A pause pressed before the music began interrupts it (an AbortError),
    // which is the reader's own doing; anything else, sound not allowed or no music to play, is said.
    function refused(error) {
      if (error.name !== 'AbortError') giveUp();
    }

    function showWait() {
      if (waitTimer) return;
      waitLabel = clock.textContent === NO_MUSIC ? '' : clock.textContent;
      clock.textContent = '';
      clock.classList.add('loading');
      waitTimer = setTimeout(giveUp, WAIT_LIMIT * 1000);
    }

    function hideWait() {
      if (!waitTimer) return;
      clearTimeout(waitTimer);
      waitTimer = null;
      clock.classList.remove('loading');
      clock.textContent = waitLabel;
    }

    // The music plays, from the start or again after running short of data: the film follows it.
    music.addEventListener('playing', () => {
      if (!playing) return;
      hideWait();
      if (!ticking) {
        ticking = true;
        requestAnimationFrame(tick);
      }
    });
    // The music has run short of data: the film holds with it, under the wait mark.
    music.addEventListener('waiting', () => { if (playing) showWait(); });
    // The browser paused the music itself (another app took the sound, say), so the film pauses with it.
    music.addEventListener('pause', () => {
      if (!playing || !music.paused) return;
      playing = false;
      button.textContent = 'play';
      if (ticking) offset = music.currentTime % SayHi.beats.DURATION;
      halt();
    });
    // Every source of the music, or the file itself, failed.
    for (const target of [music, lastSource]) target.addEventListener('error', () => { if (playing) giveUp(); });

    ready.then(() => {
      fit();
      button.addEventListener('click', play);
      const at = new URLSearchParams(location.search).get('at');
      if (at !== null) {
        offset = at.endsWith('s') ? Number(at.slice(0, -1)) : SayHi.beats.time(at);
        SH.seek(offset);
        clock.textContent = SayHi.beats.label(offset);
      }
    });
  })();
</script>
</body>
</html>

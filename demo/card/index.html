<script src="../../lib/fwiends/film/props.js"></script>
<script src="../../lib/fwiends/props/cake.js"></script>
<script src="../../lib/fwiends/film/film.js"></script>
<script>
  // The film (lib/fwiends/film/scene.js): a card. A friend sits on a ruled page; phy, the host, hops in with a
  // cake and hands it over, for no particular reason. The friend answers in marks, surprise and then
  // a song, with a happy hop, while the card writes itself across the top. ?for=<name> picks the
  // friend: any friend but phy, and Yuda when the name is not one.
  const PF = PhyFriends, RULE = PF.scene.RULE, HOP = PF.scene.HOP;
  const WORLD = { width: 1440, height: 810 };  // 16:9 and 15 rules: the pair, their marks and the card's two lines.
  const GROUND = RULE * 13;
  const PAGE_RULE_PX = 32;                       // The page's rule (lib/style/site/notebook.css), for sizes taken from the page.
  const DEFAULT_RECIPIENT = 'yuda';
  const CLOSE = 24;                              // Paper between phy's outline and the friend's; friends who know each other need 4 (lib/fwiends/src/cast.js).
  const LETTERS_PER_SECOND = 14;                 // How fast the hand writes.
  // The card's two lines, a rule in from the edge, spaced as a page's title and intro are: the first
  // at a title's size on the third rule, the second at a name's size in the lighter ink, a rule
  // below the next, clear of the first line's tails.
  const CARD = {
    x: RULE,
    heading: { size: RULE * 64 / PAGE_RULE_PX, y: RULE * 3 },
    aside: { text: 'for no particular reason', size: RULE * 31 / PAGE_RULE_PX, y: RULE * 5 },
  };
  const ENTRY = { at: 0.5, stride: 140, height: 30, clearance: 24, noticed: 0.4 };  // The friend looks up once phy is in the frame.
  // phy's words, centered above phy (film.css) on the sixth rule above the floor, clear of phy's ears.
  const SPEECH = { size: 40, rulesAboveFloor: 6 };
  // The beats after phy lands, in seconds.
  const BEAT = { say: 0.3, words: 2.2, give: 1.4, handing: 0.8, surprise: 2.3, write: 2.5, song: 3.4, smile: [3.5, 4.7], end: 0.8 };
  const OBJECT_PRONOUN = { he: 'him', she: 'her', they: 'them', it: 'it' };  // As the owners give them (lib/fwiends/characters/cast.js).

  const recipientName = chooseRecipient(filmPage.params.get('for'));
  const scene = PF.scene.create(document.querySelector('.stage'), { ...WORLD, ground: GROUND, boil: filmPage.boilRate() });
  const friend = scene.add(recipientName, { look: 'around' });
  const phy = scene.add(PF.cast.host, { at: Infinity });
  const { friendX, phyX } = placePair(phy.extent(), friend.extent());
  friend.moveTo(friendX, { at: 0, duration: 0 });  // Measured where it was added, then set in its place before the film begins.
  const entrance = phyEntrance(phyX);
  const cake = scene.prop('cake', { state: ['lit'], x: entrance.from, y: GROUND, at: ENTRY.at });  // The films' own cake (lib/fwiends/props/cake.js).
  carryAlong(cake, entrance);
  const duration = playBeats(entrance.land);
  describe();
  filmPage.listCredits(document.querySelector('.credits'), [recipientName, PF.cast.host]);
  listRecipients();
  filmPage.present(scene, { duration, button: document.querySelector('.replay') });

  // The code name of the friend the card is for, from ?for= (a code name, or a name as its owner writes it).
  function chooseRecipient(requested) {
    const wanted = (requested || '').toLowerCase();
    const match = PF.cast.names().find(name => name === wanted || PF.cast.friend(name).name.toLowerCase() === wanted);
    return match && match !== PF.cast.host ? match : DEFAULT_RECIPIENT;
  }

  // phy stands CLOSE to the left of the friend, and the pair is centered in the frame.
  function placePair(phyOutline, friendOutline) {
    const apart = phyOutline.right + CLOSE + friendOutline.left;
    const width = phyOutline.left + apart + friendOutline.right;
    const phyAt = (WORLD.width - width) / 2 + phyOutline.left;
    return { phyX: phyAt, friendX: phyAt + apart };
  }

  // phy hops in from just past the left edge, watching the friend.
  function phyEntrance(to) {
    const from = -(phy.extent().right + ENTRY.clearance);
    const hops = Math.max(1, Math.round((to - from) / ENTRY.stride)), travel = hops * HOP.seconds;
    phy.enter({ from, to, at: ENTRY.at, hops, duration: travel, height: ENTRY.height }).look(friend, { at: ENTRY.at });
    return { from, to, hops, travel, land: ENTRY.at + travel };
  }

  // The cake keeps to phy's hops, resting on the floor in front of phy's paws: still while phy
  // crouches, and along the same arc in the air. Where phy glides (reduced motion, on the page
  // only), so does the cake.
  function carryAlong(item, { from, to, hops, travel }) {
    if (scene.reduced && !filmPage.filming) {
      item.moveTo({ x: to }, { at: ENTRY.at, duration: travel, ease: 'smooth' });
      return;
    }
    const hopSeconds = travel / hops, flight = hopSeconds * (1 - 2 * HOP.crouch);
    for (let k = 0; k < hops; k++) {
      const x = from + (to - from) * (k + 1) / hops;
      item.moveTo({ x }, { at: ENTRY.at + k * hopSeconds + HOP.crouch * hopSeconds, duration: flight, ease: 'smooth', arc: ENTRY.height });
    }
  }

  // Everything after phy lands. Returns the film's length in seconds.
  function playBeats(land) {
    const name = friend.displayName, heading = `a cake for ${name}`;
    const rise = SPEECH.rulesAboveFloor * RULE - PF.groundOf(phy.spec) + PF.scene.WORDS.y;  // From WORDS.y above the eyes to its rule.
    friend.look(phy, { at: ENTRY.at + ENTRY.noticed });
    phy.say(`for you, ${name}.`, { to: friend, side: 0, size: SPEECH.size, rise, at: land + BEAT.say, seconds: BEAT.words });
    phy.give(cake, friend, { at: land + BEAT.give, duration: BEAT.handing, height: 0 });  // Handed over along the floor's arc, paw to paw.
    friend.look(cake, { at: land + BEAT.give + BEAT.handing / 2 });
    friend.feel('surprised', { at: land + BEAT.surprise });
    friend.look(phy, { at: land + BEAT.song });
    friend.emote('♪', { at: land + BEAT.song }).play(PF.emotion.greeting(friend.spec), { at: land + BEAT.song });  // The gallery's hi.
    phy.pose(PF.emotion.face('happy'), { at: land + BEAT.smile[0], until: land + BEAT.smile[1] });
    const asideAt = writeLine(heading, CARD.heading, land + BEAT.write, { graphite: true });
    const done = writeLine(CARD.aside.text, CARD.aside, asideAt, { tone: 'ink-2' });
    return done + BEAT.end;
  }

  // Writes one line of the card and returns when it is finished.
  function writeLine(text, { size, y }, at, style) {
    const seconds = text.length / LETTERS_PER_SECOND;
    scene.write(text, { x: CARD.x, y, size, at, seconds, ...style });
    return at + seconds;
  }

  function describe() {
    const name = friend.displayName, them = OBJECT_PRONOUN[PF.cast.friend(recipientName).pronoun] || name;
    scene.el.setAttribute('aria-label', `a short film on a ruled page. ${name} sits on the page. phy hops in with a small cake with three ` +
      `candles, says: for you, ${name}, and hands ${them} the cake. ${name} is surprised, then hops with a song, and the card writes ` +
      `itself across the top: a cake for ${name}, ${CARD.aside.text}.`);
  }

  // A link for every friend but the host; the one the card is for is ringed, as the page's nav rings the page.
  function listRecipients() {
    const list = document.querySelector('.recipients ul');
    for (const name of PF.cast.names().filter(n => n !== PF.cast.host)) {
      const item = document.createElement('li'), display = PF.cast.friend(name).name;
      item.innerHTML = name === recipientName ? `<span aria-current="true">${display}</span>` : `<a href="?for=${name}">${display}</a>`;
      list.appendChild(item);
    }
  }
</script>

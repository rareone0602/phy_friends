      <rect width="718" height="547" fill="#fff"/>
      <g fill="none" stroke="#000" stroke-linecap="round" stroke-linejoin="round">
        <path stroke-width="36.3" d="M239.3 235.5Q372.8 236 396.3 231.3"/>

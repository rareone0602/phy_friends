<!-- YuanYuan's seal: the artist's seal of @Milk_YuanYuan, YuanYuan's owner, which stands beside
     YuanYuan in the gallery. It is redrawn as vector paths fitted to characters/yuanyuan/examples/seal.png
     (855 x 736 px); its coordinates are that picture's pixels, less the offset of this viewBox (66, 139).
     The ink, #a10005, is the picture's own. Brush strokes of even width (the whiskers, the tail, and the
     short bar and the stem of the glyph) are stroked center-lines with round caps. The ears, the frame and
     the inner square are filled outlines traced from the picture, and the glyph's long bar and spiral, one
     stroke whose width varies, is a filled outline. A mask knocks the glyph out of the inner square, so
     the paper shows through it, as it does through a stamped seal. The seal belongs to its owner. -->
